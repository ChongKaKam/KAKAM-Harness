name: kakam-harness
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PORT: '3600'
      DATA_DIR: /app/data
      NODE_ENV: production
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-3600}:3600'
    volumes:
      - kakam-data:/app/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  kakam-data:
